name: Deploy grammar audio package

on:
  push:
    paths:
      - WEB-AUDIOS-PARA-GITHUB-g.zip
      - .github/workflows/deploy-grammar-audio.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate and extract package
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          archive_path = Path("WEB-AUDIOS-PARA-GITHUB-g.zip")
          with zipfile.ZipFile(archive_path) as archive:
              files = [name for name in archive.namelist() if not name.endswith("/")]
              assert len(files) == 134, len(files)
              assert all(name.startswith("g/") for name in files)
              assert sum(name.endswith(".html") for name in files) == 67
              assert sum(name.endswith(".mp3") for name in files) == 66
              assert sum(name.endswith(".css") for name in files) == 1
              archive.extractall(".")
          PY

      - name: Commit website and remove temporary deployment files
        shell: bash
        run: |
          rm WEB-AUDIOS-PARA-GITHUB-g.zip
          rm .github/workflows/deploy-grammar-audio.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add g WEB-AUDIOS-PARA-GITHUB-g.zip .github/workflows/deploy-grammar-audio.yml
          git commit -m "Publish Grammatica Medie audio pages"
          git push
